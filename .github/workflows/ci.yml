name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run --locked pytest
      - run: uv run --locked python scripts/osm_grid_study.py
      - run: uv run --locked python scripts/reproduce.py --demo
      - run: git diff --exit-code -- 'outputs/demo/*.csv' 'outputs/demo/*.json' 'outputs/osm/*.csv' 'outputs/osm/*.json' docs/data.json
      - run: uv run --locked python scripts/verify_reproduced_outputs.py
