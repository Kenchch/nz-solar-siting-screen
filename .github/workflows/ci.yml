name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      - run: pytest
      - run: python scripts/reproduce.py --demo
      - run: git diff --exit-code -- 'outputs/demo/*.csv' 'outputs/demo/*.json' docs/data.json
      - run: python scripts/verify_reproduced_outputs.py
