project:
  study_area: Canterbury, New Zealand
  crs_epsg: 2193
  screening_date: 2026-09-13

siting:
  minimum_area_ha: 20.0
  minimum_average_width_m: 180.0
  maximum_reject_rate: 0.55
  # Demo-only top half of eight surviving fixtures; never an empirical estimate.
  top_n_comparison: 4
  usable_lcdb_classes:
    - High Producing Exotic Grassland
    - Low Producing Grassland
    - Short-rotation Cropland
    - Orchard Vineyard or Other Perennial Crop
  grid_distance_review_m: 5000.0
  # Absolute grid/road rank difference that triggers the verify-grid flag on the
  # demo path only. It is a count of ranks, so it does not transfer between
  # sample sizes: 3 is meaningful across eight demo fixtures and fires on
  # essentially every site at n = 2,356. The OSM study deliberately does not use
  # it; see osm_study below.
  rank_shift_review: 3
  # Review-ordering weights. Grid distance is intentionally excluded from the
  # score and published as distances plus a verify flag instead.
  screen_score_weights:
    solar_resource: 0.6
    area: 0.4

solar:
  latitude_deg: -43.55
  longitude_deg: 172.45
  solar_time_basis: apparent_solar
  # North-facing fixed-tilt array; 0 degrees is the horizontal-plane proxy.
  tilt_deg: 25.0
  tilt_sensitivity_deg:
    - 0.0
    - 25.0
    - 35.0
  target_capacity_factor: 0.175
  shaping_exponent: 1.15
  shaping_exponent_sensitivity:
    - 1.0
    - 1.15
    - 1.3
  timestep_minutes: 30

# The OpenStreetMap substitute study. Tier boundaries are in volts and follow
# what a connection decision actually distinguishes, not what OSM tags happen to
# record: a Canterbury project of tens of megawatts connects at 33 or 66 kV, not
# at 220 kV and certainly not to an HVDC pole.
osm_study:
  # Terrain and water rules, added after an aerial review of the twenty largest
  # grid-proxy disagreements found that eleven were not developable land and
  # none of those failures was a grid problem. Thresholds were chosen with those
  # twenty labels in view, so the quoted hit rate is in-sample.
  terrain:
    # S-08: mean slope over the polygon, Copernicus GLO-30. 10 degrees is well
    # past the point where fixed-tilt racking needs terrain-following or
    # earthworks; it is an exclusion, not a preference.
    maximum_mean_slope_deg: 10.0
    # S-10: coastal hazard review. Not an exclusion - coastal land is not
    # automatically undevelopable - but a 30-year asset within a kilometre of an
    # open coast needs an erosion and inundation assessment before anything else.
    coastal_review_distance_m: 1000.0
  excluded_voltage_v: 350000
  connection_tier: subtransmission_33_66kv
  voltage_tiers:
    transmission_110kv_plus:
      minimum_v: 110000
      maximum_v: 349999
      review_distance_m: 20000.0
    subtransmission_33_66kv:
      minimum_v: 33000
      maximum_v: 109999
      review_distance_m: 5000.0
    distribution_22kv:
      minimum_v: 0
      maximum_v: 32999
      review_distance_m: 1000.0

market:
  node: ISL0661
  timezone: Pacific/Auckland
  # Real metered grid-exit demand at the same node, used as the M3 control
  # shape so the capture rate is compared with something other than a flat line.
  load_control_path: data/derived/ISL0661_load_2019_2025.csv.gz
